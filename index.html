<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR DEATH COUNT DOWN</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #14233e, #03050c 70%);
  color: white;
  font-family: Arial, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

.container {
  width: 90%;
  max-width: 750px;
  text-align: center;
  padding: 30px 15px;
  animation: appear 1.5s ease;
}

h1 {
  font-size: clamp(25px, 6vw, 48px);
  letter-spacing: 8px;
  margin-bottom: 15px;
  text-shadow: 0 0 15px #66baff, 0 0 35px #237bff;
  animation: glow 2s infinite alternate;
}

.subtitle {
  color: #a8c9ff;
  letter-spacing: 4px;
  font-size: 12px;
  margin-bottom: 45px;
}

.circle {
  width: 230px;
  height: 230px;
  max-width: 70vw;
  max-height: 70vw;
  margin: auto auto 40px;
  border: 3px solid rgba(101, 174, 255, .5);
  border-radius: 50%;
  box-shadow: 0 0 25px #247aff, inset 0 0 25px #174b91;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: float 4s ease-in-out infinite;
}

#days {
  font-size: clamp(65px, 18vw, 100px);
  font-weight: bold;
  line-height: 1;
  text-shadow: 0 0 20px #58aaff;
}

.days-label {
  letter-spacing: 8px;
  margin-top: 12px;
  color: #a9d5ff;
}

.timer {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 500px;
  margin: auto;
}

.unit {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(110,170,255,.35);
  padding: 20px 5px;
  border-radius: 12px;
  backdrop-filter: blur(8px);
  animation: appear 1s ease;
}

.unit span {
  display: block;
  font-size: clamp(25px, 6vw, 40px);
  font-weight: bold;
  color: #b7ddff;
}

.unit small {
  display: block;
  margin-top: 8px;
  letter-spacing: 2px;
  font-size: 10px;
  color: #8caedc;
}

.footer {
  margin-top: 35px;
  color: #7894bd;
  letter-spacing: 3px;
  font-size: 11px;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #298bff; }
  to { text-shadow: 0 0 30px #71c6ff, 0 0 50px #246dff; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.3); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="stars" id="stars"></div>

<main class="container">
  <h1>YOUR DEATH COUNT DOWN</h1>
  <p class="subtitle">YOUR EVERY SECOND COUNTS LIFE</p>

  <div class="circle">
    <div id="days">94</div>
    <div class="days-label">DAYS</div>
  </div>

  <div class="timer">
    <div class="unit">
      <span id="hours">00</span>
      <small>HOURS</small>
    </div>
    <div class="unit">
      <span id="minutes">00</span>
      <small>MINUTES</small>
    </div>
    <div class="unit">
      <span id="seconds">00</span>
      <small>SECONDS</small>
    </div>
  </div>

  <p class="footer" id="message">THE COUNTDOWN HAS BEGUN</p>
</main>

<script>
// Countdown starts now and lasts exactly 94 days.
const endDate = Date.now() + 94 * 24 * 60 * 60 * 1000;

function updateCountdown() {
  const remaining = Math.max(0, endDate - Date.now());

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");

  if (remaining === 0) {
    document.getElementById("message").textContent =
      "THE COUNTDOWN IS COMPLETE!";
  }
}

updateCountdown();
setInterval(updateCountdown, 1000);

// Create animated stars.
const stars = document.getElementById("stars");

for (let i = 0; i < 100; i++) {
  const star = document.createElement("div");
  star.className = "star";
  const size = Math.random() * 3 + 1;

  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 3 + "s";
  stars.appendChild(star);
}
</script><script>
const COUNTDOWN_DURATION = 94 * 24 * 60 * 60 * 1000;
let endDate = Date.now() + COUNTDOWN_DURATION;

function updateCountdown() {
  let remaining = endDate - Date.now();

  // Restart automatically after reaching zero
  if (remaining <= 0) {
    endDate = Date.now() + COUNTDOWN_DURATION;
    remaining = COUNTDOWN_DURATION;
  }

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");

  document.getElementById("message").textContent =
    "THE COUNTDOWN HAS BEGUN";
}

updateCountdown();
setInterval(updateCountdown, 1000)
</body>
</html>
